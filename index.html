<title>영단어 암기 트레이너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap">
<style>
/* Layout: one narrow study column; a big index card in the middle, answers stacked under it */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#16202F; --muted:#5D6779; --line:#DCE1EA;
  --accent:#2F5BEA; --accent-soft:#E6ECFD; --ok:#16884A; --ok-soft:#E3F5EA; --bad:#C93838; --bad-soft:#FBE7E7;
  --hl:#FFE45C;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-word:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151F; --surface:#18202D; --ink:#E8ECF3; --muted:#9AA4B6; --line:#2A3446;
  --accent:#7D9BFF; --accent-soft:#232F4F; --ok:#4CC787; --ok-soft:#17382A; --bad:#FF7A7A; --bad-soft:#3E1F23; --hl:#8A7716; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151F; --surface:#18202D; --ink:#E8ECF3; --muted:#9AA4B6; --line:#2A3446;
  --accent:#7D9BFF; --accent-soft:#232F4F; --ok:#4CC787; --ok-soft:#17382A; --bad:#FF7A7A; --bad-soft:#3E1F23; --hl:#8A7716; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding:24px 16px 48px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:1.6rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:0}
p{margin:0}
.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0D1322}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0D1322}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.link{background:none;border:0;color:var(--muted);padding:6px 0;font-size:.9rem}
.stat{display:flex;gap:24px;flex-wrap:wrap}
.stat b{font-size:1.6rem;font-variant-numeric:tabular-nums;display:block;line-height:1.2}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.steps{margin:0;padding-left:1.2em;color:var(--muted);font-size:.92rem;display:grid;gap:4px}
.steps b{color:var(--ink)}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.set{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.set:hover{border-color:var(--accent)}
.set .n{font-weight:700}
.set .w{font-family:var(--f-word);font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.meter.big{height:8px}.meter.big>i{background:var(--accent)}
.toggles{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
/* study card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 20px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;box-shadow:0 1px 0 var(--line)}
.dir{font-size:.75rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.prompt{font-size:1.7rem;font-weight:700;text-wrap:balance;overflow-wrap:anywhere}
.prompt.en{font-family:var(--f-word);font-size:2.1rem}
.cloze{align-items:stretch;text-align:left}
.cloze .dir{text-align:center}
.sents{margin:0;padding-left:1.4em;display:grid;gap:12px;font-family:var(--f-word);font-size:1.15rem;line-height:1.6}
.sents li{overflow-wrap:anywhere}
.blank{display:inline-block;border-bottom:2px solid var(--accent);min-width:3em;line-height:1.1}
.books{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500;display:flex;gap:8px;align-items:baseline}
.tab small{color:var(--muted);font-variant-numeric:tabular-nums}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tab.on small{color:inherit;opacity:.8}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:330px;overflow-y:auto;padding:2px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:5px}
.day:hover{border-color:var(--accent)}
.day.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day b{font-variant-numeric:tabular-nums}
.day.done b::after{content:" ✓";color:var(--ok)}
.dw{font-family:var(--f-word);font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.here{display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--accent);padding-left:12px}
.pos{font-family:var(--f-body);font-style:italic;font-weight:400;font-size:.8rem;color:var(--muted)}
.ex{font-family:var(--f-word);font-style:italic;font-size:.92rem;color:var(--muted);margin-top:2px}
.page-head{display:flex;flex-direction:column;gap:2px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.page-head h1{font-family:var(--f-word);font-size:2rem}
.book{list-style:none;margin:0;padding:0;display:grid}
.entry{display:grid;grid-template-columns:3.2em 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.entry .no{font-family:var(--f-word);color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;padding-top:4px}
.entry .txt{min-width:0;display:flex;flex-direction:column;gap:3px}
.entry .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.entry .en{font-family:var(--f-word);font-weight:700;font-size:1.2rem;overflow-wrap:anywhere}
.entry .speak{width:28px;height:28px;font-size:.75rem}
.entry .ko{color:var(--ink)}
.entry .ko.hide{color:transparent;background:var(--line);border-radius:6px;cursor:pointer;user-select:none}
.hint{font-family:var(--f-word);color:var(--muted);letter-spacing:.06em}
.type{display:flex;gap:8px}
.type input{flex:1;min-width:0;font:inherit;font-family:var(--f-word);font-size:1.25rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.type input.ok{border-color:var(--ok);background:var(--ok-soft)}
.type input.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb .ans{font-family:var(--f-word);font-size:1.3rem;font-weight:700}
.mark{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 2px}
.speak{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;flex:none;font-size:.9rem}
/* preview & list */
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.item .en{font-family:var(--f-word);font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}
.item .ko{color:var(--muted);overflow-wrap:anywhere;min-width:0}
.item .ko.hide{color:transparent;background:var(--line);border-radius:6px;cursor:pointer;user-select:none}
.item .x{font-size:.8rem;color:var(--bad);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .txt{min-width:0;display:flex;flex-direction:column}
.score{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.keys{font-size:.8rem;color:var(--muted);text-align:center}
/* 4지선다 보기 */
.choices{display:grid;gap:8px}
.choice{display:flex;gap:12px;align-items:baseline;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:1.05rem;overflow-wrap:anywhere}
.choice.en{font-family:var(--f-word);font-size:1.15rem}
.choice .num{font-family:var(--f-body);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.bad{border-color:var(--bad);background:var(--bad-soft)}
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal{width:100%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.code{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px}
.field input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.erows{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.erow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.erow input{min-width:0;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.erow input[data-f="w"]{font-family:var(--f-word)}
.imp{display:flex;gap:8px}
.imp input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:480px){.prompt.en{font-size:1.7rem}.card{padding:22px 14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main id="app"></main>

<script>
const EXAM=[
["certain","특정한"],["intention","의도"],["profit","이익, 수익"],["political benefit","정치적 이점"],
["disturb","방해하다"],["harm","해(를 끼치다)"],["B as well as A","A뿐만 아니라 B도"],["individual","개인"],
["involved","관련된"],["state","상태"],["emergency","비상, 응급"],["measure","측정하다"],
["struck","strike(강타하다)의 과거형"],["resident","주민"],["shelter","주거지"],["the news that 주어 동사","주어가 동사한다는 소식"],
["be about to 동사원형","막 동사하려고 하다"],["be up to ~","~에 달려 있다"],["apparently","명백하게"],["displaced","난민의, 추방된"],
["so 형용사 that 주어 동사","너무 형용사해서 주어가 동사하다"],["anxious","불안해하는"],["aftershock","여진"],["government","정부"],
["viral","바이러스성의"],["significantly","상당히"],["farther","더 멀리"],["on average","평균적으로"],
["explanation","설명"],["phenomenon","현상"],["previously","이전에는"],["daily life","일상생활"],
["tend to 동사원형","동사하는 경향이 있다"],["effortlessly","노력하지 않고, 쉽게"],["likely","그럴듯한, ~할 공산이 있는"],["proof","증거"],
["critically","비판적으로"],["examine","검토하다"],["moreover","더욱이, 게다가"],["be inclined to 동사원형","동사하는 경향이 있다"],
["fit","들어맞다"],["process","과정"],["fall into ~","~에 빠지다"],["trap","덫"],
["confirmation bias","확증 편향"],["that is","즉, 다시 말해"],["selectively","선택적으로"],["ignore","무시하다"],
["election","선거"],["blindly","맹목적으로"],["describe","묘사하다, 설명하다"],["favored","선호하는"],
["candidate","후보자"],["in a positive way","긍정적으로"],["unconsciously","무의식적으로"],["spot","발견하다"],
["face value","액면가"],["judge","판단하다"],["judgment","판단"],["analyze","분석하다"],
["evaluate","평가하다"],["affect","영향을 주다"],["article","글, 기사"],["suit","어울리다"],
["look for ~","~를 찾다"],["oppose","반대하다"],["as well","(문장 끝에서) 또한, 역시"],["credibility","신뢰성"],
["source","출처"],["intent","의도"],["whether 주어 동사","주어가 동사하는지 여부"],["reliable","믿을 만한"],
["eliminate","제거하다"],["objectively","객관적으로"],["trust","신뢰하다"],["lead to ~","~에 이르다"],
["pass through ~","~를 빠져나가다"],["unidentified","정체불명의"]
];
let W=EXAM;
const ALT={judgment:["judgement"],analyze:["analyse"]};
const SET=10;let NSETS=Math.ceil(W.length/SET);
const KEY="engword-trainer-v1";
const $app=document.getElementById("app");
let S=load();
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!s||!s.w)s={w:{}};if(!s.dir)s.dir="both";if(!s.mode)s.mode="write";
  // 예전 기록(번호 키)을 "책:단어" 키로 옮김
  for(const k of Object.keys(s.w))if(/^\d+$/.test(k)){if(EXAM[k])s.w["exam:"+EXAM[k][0]]=s.w[k];delete s.w[k]}
  return s}
// 지금 보고 있는 책과 Day. 서버가 없으면 내 시험 범위만 쓴다
let CUR={book:"exam",day:0,title:"내 시험 범위"};
let BOOKS=[],BOOKWORDS={},SERVER=false,FLASH="";
// 내 세트: 직접 만들거나 사진으로 만든 세트. 이 브라우저(S.mySets)에만 저장된다
const MY={title:40,w:60,ko:100,words:500};
const mineBooks=()=>Object.entries(S.mySets||{}).sort((a,b)=>a[1].created-b[1].created)
  .map(([id,s])=>({id,title:s.title,count:s.words.length,daySize:s.words.length,days:[{day:1,count:s.words.length}],mine:true}));
const allBooks=()=>[...BOOKS,...mineBooks()];
const findBook=id=>allBooks().find(b=>b.id===id);
const sent={};let syncTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(SERVER){clearTimeout(syncTimer);syncTimer=setTimeout(sync,600)}}
async function sync(){
  const by={};
  for(const[k,v]of Object.entries(S.w)){const j=JSON.stringify(v);if(sent[k]===j)continue;
    const c=k.indexOf(":"),b=k.slice(0,c);(by[b]||(by[b]={}))[k.slice(c+1)]={m:v.m?1:0,x:v.x||0};sent[k]=j}
  for(const[b,items]of Object.entries(by)){
    try{await fetch(`/api/progress/${encodeURIComponent(b)}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(items)})}
    catch(e){for(const w of Object.keys(items))delete sent[b+":"+w]}}
}
async function pullProgress(b){
  try{const r=await fetch(`/api/progress/${encodeURIComponent(b)}`);if(!r.ok)return;const j=await r.json();
    for(const[w,v]of Object.entries(j)){const k=b+":"+w,o=S.w[k]||{m:0,x:0};
      S.w[k]={m:(o.m||v.m)?1:0,x:Math.max(o.x||0,v.x||0)}}
    save()}catch(e){}
}
const wkey=(b,w)=>b+":"+w;
function st(i){const k=wkey(CUR.book,W[i][0]);return S.w[k]||(S.w[k]={m:0,x:0})}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().replace(/[ㄱ-힝]/g," ").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
// 기본 음성은 품질이 낮은 경우가 많아서, 고품질 영어 음성을 이름으로 골라 쓴다
let VOICE=null;
const GOOD=[/premium/i,/enhanced/i,/natural/i,/Google US English/,/Samantha/,/Ava/,/Allison/,/Susan/,/Zoe/,/Microsoft (Aria|Jenny|Guy)/,/Google UK English/,/Daniel/,/Karen/];
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  for(const re of GOOD){const v=vs.find(v=>re.test(v.name));if(v)return VOICE=v}
  VOICE=vs.find(v=>/en[-_]US/i.test(v.lang))||vs[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function sayNow(t){try{speechSynthesis.cancel();
  const clean=t.replace(/[ㄱ-힝]+/g," ").replace(/[~()]/g," ").replace(/\s+/g," ").trim();
  const u=new SpeechSynthesisUtterance(clean);u.lang=VOICE?VOICE.lang:"en-US";if(VOICE)u.voice=VOICE;u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function hintOf(en){return en.split(" ").map(w=>/[a-zA-Z]/.test(w)?w[0]+"_".repeat(w.length-1):w).join("  ")}
function enRight(input,i){const n=norm(input);if(!n)return false;
  return W.some(([en,ko],k)=>(k===i||ko===W[i][1])&&(norm(en)===n||(ALT[en]||[]).includes(n)))}
// 한글 뜻 채점: 띄어쓰기·문장부호 무시, 쉼표로 나뉜 뜻 중 하나만 맞아도 정답, 괄호 안은 써도 되고 안 써도 됨
const normKo=s=>s.toLowerCase().replace(/[^가-힣a-z]/g,"");
const stem=s=>s.replace(/(하다|다)$/,"");
function koVariants(ko){const out=new Set();
  ko.replace(/\(문장 끝에서\)/,"").split(",").forEach(p=>{[p.replace(/\([^)]*\)/g,""),p.replace(/[()]/g,"")].forEach(x=>{const n=normKo(x);if(n)out.add(n)})});
  return[...out]}
function koRight(input,i){const n=normKo(input);if(!n)return false;
  return W.some(([en,ko],k)=>(k===i||en===W[i][0])&&koVariants(ko).some(v=>v===n||stem(v)===stem(n)))}
function koHint(ko){const p=ko.replace(/\(문장 끝에서\)/,"").split(",")[0].trim();return p[0]+" "+"○".repeat(Math.max(0,normKo(p).length-1))}
const setIdx=s=>Array.from({length:Math.min(SET,W.length-s*SET)},(_,k)=>s*SET+k);
let key=null; // current keyboard handler
document.addEventListener("keydown",e=>{if(key)key(e)});

/* ---------- 단어책 ---------- */
function bookBar(){
  if(!allBooks().length)return"";
  const tabs=[{id:"exam",title:"내 시험 범위",count:EXAM.length},...allBooks()].map(b=>`<button class="tab ${CUR.book===b.id?"on":""}" data-book="${esc(b.id)}">${esc(b.title)}<small>${b.count}</small></button>`).join("");
  let days="";
  const bk=findBook(CUR.book);
  if(bk&&BOOKWORDS[bk.id]&&bk.days.length>1){const all=BOOKWORDS[bk.id];
    days=`<div class="days">${bk.days.map(d=>{const ws=all.slice((d.day-1)*bk.daySize,(d.day-1)*bk.daySize+d.count);
      const done=ws.filter(o=>(S.w[wkey(bk.id,o.w)]||{}).m).length;
      return`<button class="day ${CUR.day===d.day?"on":""} ${done===d.count?"done":""}" data-day="${d.day}"><b>Day ${String(d.day).padStart(2,"0")}</b><span class="dw">${esc(ws[0].w)} – ${esc(ws[ws.length-1].w)}</span><span class="meter"><i style="width:${done/d.count*100}%"></i></span></button>`}).join("")}</div>`}
  return`<nav class="books">${tabs}</nav>${days}`}
function bindBookBar(){
  $app.querySelectorAll("[data-book]").forEach(b=>b.onclick=()=>openBook(b.dataset.book));
  $app.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>openDay(CUR.book,+b.dataset.day));
}
const multiDay=()=>CUR.day>0&&((findBook(CUR.book)||{}).days||[]).length>1;
function setWords(list,cur){W=list;NSETS=Math.ceil(W.length/SET);CUR=cur;S.cur={book:cur.book,day:cur.day};save()}
async function openBook(id){
  if(id==="exam"){setWords(EXAM,{book:"exam",day:0,title:"내 시험 범위"});return home()}
  const bk=findBook(id);if(!bk)return;
  if(bk.mine)BOOKWORDS[id]=S.mySets[id].words.map(o=>({w:o.w,ko:o.ko,pos:"",ex:""}));
  else if(!BOOKWORDS[id]){
    try{const r=await fetch(`/api/books/${encodeURIComponent(id)}/words`);BOOKWORDS[id]=(await r.json()).words}
    catch(e){$app.insertAdjacentHTML("afterbegin",`<div class="fb bad">단어책을 불러오지 못했어요. 서버가 켜져 있는지 확인해 주세요.</div>`);return}
    await pullProgress(id)}
  const last=S.cur&&S.cur.book===id?S.cur.day:0;
  const all=BOOKWORDS[id];
  const firstOpen=bk.days.find(d=>all.slice((d.day-1)*bk.daySize,(d.day-1)*bk.daySize+d.count).some(o=>!(S.w[wkey(id,o.w)]||{}).m));
  return openDay(id,last||(firstOpen?firstOpen.day:1))}
async function openDay(id,day){
  const bk=findBook(id);if(!bk)return;
  if(!BOOKWORDS[id])return openBook(id);
  const ws=BOOKWORDS[id].slice((day-1)*bk.daySize,day*bk.daySize).map(o=>[o.w,o.ko,o.pos,o.ex]);
  setWords(ws,{book:id,day,title:bk.title});home();window.scrollTo(0,0)}
async function boot(){
  try{const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),1500);
    const r=await fetch("/api/books",{signal:ctrl.signal,cache:"no-store"});
    if(!r.ok)throw 0;BOOKS=await r.json();SERVER=true;
    await pullProgress("exam");
    try{const a=await(await fetch("/api/ai-status",{cache:"no-store"})).json();AI={enabled:a.enabled===true}}catch(e){}
  }catch(e){BOOKS=[];SERVER=false}
  if(S.cur&&S.cur.book!=="exam"&&findBook(S.cur.book))return openBook(S.cur.book);
  home()}

/* ---------- 내 세트 만들기·편집 ---------- */
// rows를 정리해 저장하고 세트 id를 돌려준다. 문제가 있으면 사용자에게 보여 줄 문구로 Error를 던진다
function saveSet(id,title,rows){
  const sp=s=>String(s||"").replace(/\s+/g," ").trim();
  title=sp(title);
  if(!title)throw new Error("세트 이름을 써 주세요.");
  if(title.length>MY.title)throw new Error(`세트 이름은 ${MY.title}자까지 쓸 수 있어요.`);
  const seen=new Set(),words=[];
  for(const r of rows){const w=sp(r.w),ko=sp(r.ko);
    if(!w&&!ko)continue;
    if(!w)throw new Error(`'${ko.slice(0,20)}'의 영어 단어를 써 주세요.`);
    if(!ko)throw new Error(`'${w.slice(0,20)}'의 뜻을 써 주세요.`);
    if(w.length>MY.w||ko.length>MY.ko)throw new Error(`'${w.slice(0,20)}' 줄이 너무 길어요.`);
    if(seen.has(w.toLowerCase()))continue;
    seen.add(w.toLowerCase());words.push({w,ko})}
  if(!words.length)throw new Error("단어를 하나 이상 써 주세요.");
  if(words.length>MY.words)throw new Error(`한 세트에는 ${MY.words}단어까지 넣을 수 있어요.`);
  const nid=id||"my-"+Date.now(),sets=S.mySets||(S.mySets={});
  sets[nid]={title,words,created:sets[nid]?sets[nid].created:Date.now()};
  BOOKWORDS[nid]=words.map(o=>({w:o.w,ko:o.ko,pos:"",ex:""}));
  // 지우거나 철자를 바꾼 단어의 기록은 지운다. 이어서 하던 세트도 단어 번호가 달라져서 버린다
  const keep=new Set(words.map(o=>wkey(nid,o.w)));
  for(const k of Object.keys(S.w))if(k.startsWith(nid+":")&&!keep.has(k))delete S.w[k];
  if(S.drill&&S.drill.book===nid)delete S.drill;
  save();return nid}

// AI 기능은 서버에 키와 접근 코드가 모두 설정돼 있을 때만 켜진다. 코드는 이 브라우저에 기억한다
let AI={enabled:false},PHOTO_BUSY=false;
const AI_KEY="engword-ai-code";
const aiCode=()=>{try{return localStorage.getItem(AI_KEY)||""}catch(e){return""}};
const setAiCode=v=>{try{localStorage.setItem(AI_KEY,v)}catch(e){}};
const clearAiCode=()=>{try{localStorage.removeItem(AI_KEY)}catch(e){}};
const PHOTO_NOTE="사진은 단어를 읽기 위해 Anthropic AI로 보내지고, 이 서버에는 저장되지 않아요.";
const AI_OFF="AI 기능이 아직 설정되지 않았어요";
// 접근 코드 입력 창. 브라우저 prompt() 대신 화면 위에 띄운다. 취소하면 ""로 끝난다
function askAiCode(msg){return new Promise(res=>{
  const box=document.createElement("div");box.className="overlay";
  box.innerHTML=`<form class="panel modal" role="dialog" aria-modal="true" aria-labelledby="acT"><h2 id="acT">AI 접근 코드</h2><p class="muted">${esc(msg||"AI 기능은 접근 코드를 아는 사람만 쓸 수 있어요. 한 번 입력하면 이 브라우저에 기억돼요.")}</p><input id="acIn" class="code" type="password" autocomplete="off" aria-label="접근 코드"><div class="row"><button class="btn primary">확인</button><button class="btn" type="button" id="acNo">취소</button></div></form>`;
  document.body.appendChild(box);const inp=box.querySelector("#acIn");inp.focus();
  const prevKey=key;key=null;
  const done=v=>{box.remove();key=prevKey;res(v)};
  box.querySelector("form").onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(v){setAiCode(v);done(v)}};
  box.querySelector("#acNo").onclick=()=>done("");
  box.onkeydown=e=>{if(e.key==="Escape")done("")};
})}
// AI 엔드포인트 호출. 코드가 없거나 틀리면 다시 묻는다. 실패하면 사용자에게 보여 줄 문구로 Error를 던진다
async function aiFetch(path,body){
  let msg="";
  for(let tries=0;tries<3;tries++){
    let code=aiCode();
    if(!code){code=await askAiCode(msg);if(!code)throw new Error("접근 코드를 입력해야 AI 기능을 쓸 수 있어요.")}
    let r,j={};
    try{r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-AI-Passcode":code},body:JSON.stringify(body)})}
    catch(e){throw new Error("서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.")}
    try{j=await r.json()}catch(e){}
    if(r.status===401){clearAiCode();msg="접근 코드가 맞지 않아요. 다시 입력해 주세요.";continue}
    if(!r.ok)throw new Error(typeof j.detail==="string"?j.detail:"만들지 못했어요. 다시 시도해 주세요");
    return j}
  throw new Error("접근 코드가 맞지 않아요.")}
// 사진을 긴 변 1600px JPEG로 줄인다. 1MB가 넘으면 1280px, 품질 0.7로 다시 줄인다
async function shrinkImage(file){
  let img;
  try{img=await createImageBitmap(file)}catch(e){throw new Error("이 사진은 열 수 없어요. JPG나 PNG 사진으로 다시 골라 주세요.")}
  const enc=(max,q)=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",q)};
  let url=enc(1600,.85);
  if(url.length*.75>1e6)url=enc(1280,.7);
  return{image:url.slice(url.indexOf(",")+1),mediaType:"image/jpeg"}}
// 사진을 한 장씩 차례로 읽어 지금 편집 화면에 덧붙인다(Vercel 요청 크기 한도 때문에 한 장씩)
async function readPhotos(files){
  files=[...files];const over=files.length>5;files=files.slice(0,5);
  if(!files.length||PHOTO_BUSY)return;
  const ed=EDIT,got=[];PHOTO_BUSY=true;
  const status=t=>{const m=document.querySelector("#photoMsg");if(m)m.textContent=t};
  let err="";
  try{for(let k=0;k<files.length;k++){
      status(`사진 ${k+1}/${files.length} 읽는 중…`);
      const j=await aiFetch("/api/photo-words",await shrinkImage(files[k]));
      got.push(...(Array.isArray(j.words)?j.words:[]))}}
  catch(e){err=e.message}
  PHOTO_BUSY=false;
  if(EDIT!==ed)return; // 그사이 편집 화면을 떠났다
  const seen=new Set(),words=got.filter(r=>r&&typeof r.w==="string"&&typeof r.ko==="string"&&!seen.has(r.w.toLowerCase())&&seen.add(r.w.toLowerCase()));
  const text=err?(words.length?`${words.length}단어까지 읽고 멈췄어요. ${err}`:err)
    :words.length?`${words.length}단어를 읽었어요. 틀린 곳을 고친 뒤 저장하세요.${over?" 사진은 한 번에 5장까지 읽어서 앞의 5장만 읽었어요.":""}`
    :"단어를 찾지 못했어요. 더 밝고 가깝게 찍어 보세요. 직접 입력해도 돼요.";
  ed.append(words,{ok:!err&&words.length>0,text})}

/* ---------- question engine ---------- */
// type 0: 영어 보고 뜻 쓰기, 1: 뜻 보고 영어 쓰기
const STAGES={both:[0,1],en:[0,0],ko:[1,1]};
function ask({i,type,top,onDone}){
  const en=W[i][0],ko=W[i][1];
  const promptEn=type===0;
  let answered=false,hintUsed=false;
  $app.innerHTML=`${top}
  <div class="card">
    <span class="dir">${promptEn?"영어 → 뜻 쓰기":"뜻 → 영어 쓰기"}</span>
    <div class="prompt ${promptEn?"en":""}">${esc(promptEn?en:ko)}</div>
    ${promptEn?`<button class="speak" id="sp" aria-label="발음 듣기">▶</button>`:""}
    <div class="hint" id="hint"></div>
  </div>
  <div class="type"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${promptEn?"뜻을 한글로":"영어로"} 입력" ${promptEn?"":'lang="en"'}><button class="btn primary" id="ok">확인</button></div>
  <div class="row"><button class="link" id="hb">힌트 보기 (첫 글자)</button><button class="link" id="idk">모르겠어요</button></div>
  <div id="fb"></div>
  <p class="keys">Enter 확인 · 틀리면 Enter로 다음</p>`;
  if(promptEn)$app.querySelector("#sp").onclick=()=>sayNow(en);
  const inp=$app.querySelector("#ans");inp.focus();
  const finish=ok=>{
    answered=true;inp.disabled=true;inp.classList.add(ok?"ok":"bad");
    const fb=$app.querySelector("#fb");
    if(ok){
      fb.innerHTML=`<div class="fb ok"><span><b>정답</b> · <span class="ans">${esc(en)}</span> = ${esc(ko)}</span></div>`;
      key=null;setTimeout(()=>onDone(true,hintUsed),hintUsed?900:600);
      return;
    }
    fb.innerHTML=`<div class="fb bad"><span class="muted">정답</span><span><span class="ans mark">${esc(en)}</span> &nbsp;${esc(ko)}</span>
      <div class="row"><button class="btn primary" id="nx">다음 (Enter)</button><button class="speak" id="sp2" aria-label="발음 듣기">▶</button>${promptEn&&inp.value.trim()?`<button class="link" id="ovr">뜻은 맞게 썼어요</button>`:""}</div></div>`;
    $app.querySelector("#sp2").onclick=()=>sayNow(en);
    const next=()=>{key=null;onDone(false,hintUsed)};
    $app.querySelector("#nx").onclick=next;
    const ovr=$app.querySelector("#ovr");if(ovr)ovr.onclick=()=>{key=null;onDone(true,hintUsed)};
    key=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();next()}};
  };
  const submit=()=>{if(answered||!inp.value.trim())return;finish(promptEn?koRight(inp.value,i):enRight(inp.value,i))};
  inp.addEventListener("keydown",e=>{if(e.key!=="Enter")return;e.stopPropagation();if(e.isComposing||e.keyCode===229)return;e.preventDefault();submit()});
  $app.querySelector("#ok").onclick=submit;
  $app.querySelector("#hb").onclick=()=>{hintUsed=true;$app.querySelector("#hint").textContent=promptEn?koHint(ko):hintOf(en);inp.focus()};
  $app.querySelector("#idk").onclick=()=>{if(!answered)finish(false)};
  key=null;
}

/* ---------- 4지선다 ---------- */
// 같은 범위의 다른 단어에서 오답 보기 3개를 뽑는다. 뜻이나 철자가 같은 단어는 보기에서 뺀다
function choicesFor(i,type){
  const pick=k=>type===0?W[k][1]:W[k][0];
  const right=pick(i),opts=[right],seen=new Set([right]);
  for(const k of shuffle(W.map((_,k)=>k))){if(opts.length>=4)break;
    const v=pick(k);if(k===i||seen.has(v)||W[k][0]===W[i][0]||W[k][1]===W[i][1])continue;seen.add(v);opts.push(v)}
  return shuffle(opts)}
function askChoice({i,type,top,onDone}){
  const en=W[i][0],ko=W[i][1],promptEn=type===0,right=promptEn?ko:en,opts=choicesFor(i,type);
  let answered=false;
  $app.innerHTML=`${top}
  <div class="card">
    <span class="dir">${promptEn?"영어 → 알맞은 뜻 고르기":"뜻 → 알맞은 영어 고르기"}</span>
    <div class="prompt ${promptEn?"en":""}">${esc(promptEn?en:ko)}</div>
    ${promptEn?`<button class="speak" id="sp" aria-label="발음 듣기">▶</button>`:""}
  </div>
  <div class="choices">${opts.map((o,k)=>`<button class="choice ${promptEn?"":"en"}" data-c="${k}"><span class="num">${k+1}</span><span>${esc(o)}</span></button>`).join("")}</div>
  <div class="row"><button class="link" id="idk">모르겠어요</button></div>
  <div id="fb"></div>
  <p class="keys">숫자 1–${opts.length} 선택 · 틀리면 Enter로 다음</p>`;
  if(promptEn)$app.querySelector("#sp").onclick=()=>sayNow(en);
  const btns=[...$app.querySelectorAll("[data-c]")];
  const finish=k=>{
    if(answered)return;answered=true;
    const ok=k!==null&&opts[k]===right;
    btns.forEach((b,j)=>{b.disabled=true;if(opts[j]===right)b.classList.add("ok");else if(j===k)b.classList.add("bad")});
    const fb=$app.querySelector("#fb");
    if(ok){fb.innerHTML=`<div class="fb ok"><span><b>정답</b> · <span class="ans">${esc(en)}</span> = ${esc(ko)}</span></div>`;
      key=null;setTimeout(()=>onDone(true,false),600);return}
    fb.innerHTML=`<div class="fb bad"><span class="muted">정답</span><span><span class="ans mark">${esc(en)}</span> &nbsp;${esc(ko)}</span>
      <div class="row"><button class="btn primary" id="nx">다음 (Enter)</button><button class="speak" id="sp2" aria-label="발음 듣기">▶</button></div></div>`;
    $app.querySelector("#sp2").onclick=()=>sayNow(en);
    const next=()=>{key=null;onDone(false,false)};
    $app.querySelector("#nx").onclick=next;
    key=e=>{if(e.key==="Enter"){e.preventDefault();next()}};
  };
  btns.forEach((b,k)=>b.onclick=()=>finish(k));
  $app.querySelector("#idk").onclick=()=>finish(null);
  key=e=>{const n=+e.key;if(n>=1&&n<=opts.length){e.preventDefault();finish(n-1)}};
}

/* ---------- drill: spaced repetition inside a session ---------- */
// 하다 만 세트는 S.drill에 저장해서 창을 닫았다 열어도 이어서 할 수 있다
function drill(ids,label,resume){
  const dir=resume?resume.dir:S.dir;
  const stages=STAGES[dir]||STAGES.both,maxStage=stages.length;
  let q=resume?resume.q.map(o=>({...o})):shuffle(ids).map(i=>({i,stage:0}));
  let progress=resume?resume.progress:0,total=ids.length*maxStage,wrongs=new Set(resume?resume.wrongs:[]);
  const keep=()=>{S.drill={book:CUR.book,day:CUR.day,label,ids,dir,q:q.map(o=>({...o})),progress,wrongs:[...wrongs]}};
  const step=()=>{
    if(!q.length){delete S.drill;save();return drillDone(ids,label,wrongs)}
    const it=q[0]; // 답하기 전까지 큐에 남겨 둬야 중간에 나가도 이 단어가 저장된다
    const top=`<div class="top"><button class="link" id="back">← 그만하기</button><span class="muted">${label} · 남은 단어 ${new Set(q.map(x=>x.i)).size}</span></div>
      <div class="meter big"><i style="width:${progress/total*100}%"></i></div>`;
    ask({i:it.i,type:stages[it.stage],top,onDone:(ok,hint)=>{
      q.shift();
      if(ok&&!hint){it.stage++;progress++;
        if(it.stage<maxStage)q.splice(Math.min(q.length,3+(Math.random()*4|0)),0,it);
        else st(it.i).m=1;
      }else{
        if(!ok){st(it.i).x++;wrongs.add(it.i);if(it.stage>0){it.stage--;progress--}}
        q.splice(Math.min(q.length,2),0,it);
      }
      keep();save();step();
    }});
    $app.querySelector("#back").onclick=home;
  };
  keep();save();step();
}
function drillDone(ids,label,wrongs){
  key=e=>{if(e.key==="Enter"){e.preventDefault();home()}};
  const nextSet=label.startsWith("세트")?+label.split(" ")[1]:null;
  $app.innerHTML=`<h1>${label} 완료</h1>
  <p class="muted">${ids.length}단어를 모두 직접 써서 맞혔어요. ${wrongs.size?`중간에 틀린 ${wrongs.size}개는 아래에 표시했어요.`:"한 번도 안 틀렸어요."}</p>
  <div class="list">${ids.map(i=>`<div class="item"><button class="speak" data-say="${i}" aria-label="발음 듣기">▶</button><div class="txt"><span class="en">${esc(W[i][0])}</span><span class="ko">${esc(W[i][1])}</span></div><span class="x">${wrongs.has(i)?"틀림":""}</span></div>`).join("")}</div>
  <div class="row">${nextSet!==null&&nextSet<NSETS?`<button class="btn primary" id="nx">세트 ${nextSet+1} 학습</button>`:""}<button class="btn ${nextSet!==null&&nextSet<NSETS?"":"primary"}" id="hm">홈 (Enter)</button><button class="btn" id="again">한 번 더</button></div>`;
  $app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>sayNow(W[+b.dataset.say][0]));
  const nx=$app.querySelector("#nx");if(nx)nx.onclick=()=>preview(setIdx(nextSet),`세트 ${nextSet+1}`);
  $app.querySelector("#hm").onclick=home;
  $app.querySelector("#again").onclick=()=>drill(ids,label);
  window.scrollTo(0,0);
}

/* ---------- exam ---------- */
function exam(n){
  const ids=shuffle(W.map((_,i)=>i)).slice(0,n);
  const types=S.dir==="en"?[0]:S.dir==="ko"?[1]:[0,1];
  let k=0,score=0;const wrong=[];
  const step=()=>{
    if(k>=ids.length)return examDone(ids.length,score,wrong);
    const i=ids[k];
    const top=`<div class="top"><button class="link" id="back">← 그만하기</button><span class="muted" style="font-variant-numeric:tabular-nums">모의고사 ${k+1} / ${ids.length} · 정답 ${score}</span></div>
      <div class="meter big"><i style="width:${k/ids.length*100}%"></i></div>`;
    // 형식: 주관식(ask) / 객관식(askChoice) / 섞어서는 문제마다 반반
    const mc=S.mode==="mc"||(S.mode==="mix"&&Math.random()<.5);
    (mc?askChoice:ask)({i,type:types[Math.random()*types.length|0],top,onDone:(ok,hint)=>{
      if(ok&&!hint)score++;else{wrong.push(i);if(!ok){st(i).x++;st(i).m=0}}
      save();k++;step();
    }});
    $app.querySelector("#back").onclick=home;
  };
  step();
}
function examDone(total,score,wrong,label="모의고사",retry=()=>preview(wrong,"모의고사 오답")){
  key=e=>{if(e.key==="Enter"){e.preventDefault();wrong.length?retry():home()}};
  const pct=Math.round(score/total*100);
  $app.innerHTML=`<span class="muted">${label} 결과</span>

const CL_ALT={"intention":["intent"],"intent":["intention"]};
const reEsc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
// 예문에서 단어를 찾아 빈칸으로 만든다. 동사 변화(s, ed, ing)와 be 동사 생략도 찾는다
function findInSentence(h,ex){
  const cands=[h,...(h.startsWith("be ")?[h.slice(3)]:[])];
  for(const c of cands){const ws=c.split(" ");
    const re=new RegExp("\\b"+reEsc(ws[0])+"(?:s|es|d|ed|ing)?"+ws.slice(1).map(w=>"\\s+"+reEsc(w)).join("")+"\\b","i");
    const m=ex.match(re);if(m)return m}
  return null}
function clData(i){const en=W[i][0],[a,raw]=CL[en];return{ans:a,sents:raw.split("|"),alts:CL_ALT[en]||[]}}

function seoData(i){const en=W[i][0],s=SEO[en];
  if(s)return{ans:s[0],sents:[s[1]],alts:[...(s[2]||[]),...(ALT[en]||[])]};
  const ex=W[i][3]||"",m=ex&&findInSentence(en,ex);
  return m?{ans:m[0],sents:[ex.slice(0,m.index)+"___"+ex.slice(m.index+m[0].length)],alts:[en]}:null}

  <div id="fb"></div>
  <p class="keys">Enter 확인 · 틀리면 Enter로 다음</p>`;
  const inp=$app.querySelector("#ans");inp.focus();
  const hint=t=>{hintUsed=true;const h=$app.querySelector("#hint");h.textContent=h.textContent?h.textContent+"  ·  "+t:t;inp.focus()};
  const finish=ok=>{
    answered=true;inp.disabled=true;inp.classList.add(ok?"ok":"bad");
    $app.querySelector("#sents").innerHTML=sents.map(s=>`<li>${fill(s,true)}</li>`).join("");
    const fb=$app.querySelector("#fb");
    if(ok){fb.innerHTML=`<div class="fb ok"><span><b>정답</b> · <span class="ans">${esc(ans)}</span> = ${esc(ko)}</span></div>`;
      key=null;setTimeout(()=>onDone(true,hintUsed),hintUsed?1400:1000);return}
    fb.innerHTML=`<div class="fb bad"><span class="muted">정답</span><span><span class="ans mark">${esc(ans)}</span> &nbsp;${esc(ko)}</span>
      <div class="row"><button class="btn primary" id="nx">다음 (Enter)</button><button class="speak" id="sp2" aria-label="발음 듣기">▶</button></div></div>`;
    $app.querySelector("#sp2").onclick=()=>sayNow(ans);
    const next=()=>{key=null;onDone(false,hintUsed)};
    $app.querySelector("#nx").onclick=next;
    key=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();next()}};
  };
  const right=v=>{const n=norm(v);return!!n&&[ans,...cd.alts].some(a=>norm(a)===n)};
  const submit=()=>{if(answered||!inp.value.trim())return;finish(right(inp.value))};
  inp.addEventListener("keydown",e=>{if(e.key!=="Enter")return;e.stopPropagation();if(e.isComposing||e.keyCode===229)return;e.preventDefault();submit()});
  $app.querySelector("#ok").onclick=submit;
  $app.querySelector("#hm").onclick=e=>{e.target.disabled=true;hint("뜻: "+ko)};
  $app.querySelector("#hb").onclick=e=>{e.target.disabled=true;hint(hintOf(ans))};
  $app.querySelector("#idk").onclick=()=>{if(!answered)finish(false)};
  key=null;
}
function cloze(ids,label,get=clData){
  ids=shuffle(ids);
  let k=0,score=0;const wrong=[];
  const step=()=>{
    if(k>=ids.length)return examDone(ids.length,score,wrong,label,()=>cloze(wrong,label+" 오답",get));
    const i=ids[k];
    const top=`<div class="top"><button class="link" id="back">← 그만하기</button><span class="muted" style="font-variant-numeric:tabular-nums">${label} ${k+1} / ${ids.length} · 정답 ${score}</span></div>
      <div class="meter big"><i style="width:${k/ids.length*100}%"></i></div>`;
    askCloze({i,top,cd:get(i),onDone:(ok,hint)=>{
      if(ok&&!hint)score++;else{wrong.push(i);if(!ok)st(i).x++}
      save();k++;step();
    }});
    $app.querySelector("#back").onclick=home;
  };
  step();
}

/* ---------- word list ---------- */
function list(){
  let hide=false;
  const draw=()=>{
    key=null;
    const base=CUR.day?(CUR.day-1)*((findBook(CUR.book)||{}).daySize||0):0;
    $app.innerHTML=`<div class="top"><button class="link" id="back">← 홈</button><span class="muted">${W.length}단어</span></div>
    <header class="page-head"><span class="muted">${esc(CUR.title)}</span><h1>${multiDay()?`Day ${String(CUR.day).padStart(2,"0")}`:"전체 단어장"}</h1></header>
    <p class="muted">뜻을 가린 뒤 하나씩 떠올려 보고, 칸을 눌러 확인하세요.</p>
    <div class="row"><button class="btn" id="hide">${hide?"뜻 보이기":"뜻 가리기"}</button></div>
    <ol class="book">${W.map((w,i)=>`<li class="entry"><span class="no">${String(base+i+1).padStart(4,"0")}</span><div class="txt"><div class="head"><span class="en">${esc(w[0])}</span>${w[2]?`<i class="pos">${esc(w[2])}</i>`:""}<button class="speak" data-say="${i}" aria-label="발음 듣기">▶</button>${st(i).x?`<span class="x">${st(i).x}번 틀림</span>`:""}</div><span class="ko ${hide?"hide":""}">${esc(w[1])}</span>${w[3]?`<span class="ex">${esc(w[3])}</span>`:""}</div></li>`).join("")}</ol>`;
    $app.querySelector("#back").onclick=home;
    $app.querySelector("#hide").onclick=()=>{hide=!hide;draw()};
    $app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>sayNow(W[+b.dataset.say][0]));
    $app.querySelectorAll(".ko.hide").forEach(k=>k.onclick=()=>k.classList.remove("hide"));
  };
  draw();window.scrollTo(0,0);
}

boot();
